name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Prepare Project Structure
        run: |
          mkdir -p app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/res/xml app/src/main/java/com/zaeem/trading
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || true
          [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/ || true
          [ -f activity_session_login.xml ] && mv activity_session_login.xml app/src/main/res/layout/ || true
          [ -f bg_button_gold.xml ] && mv bg_button_gold.xml app/src/main/res/drawable/ || true
          [ -f bg_input.xml ] && mv bg_input.xml app/src/main/res/drawable/ || true
          [ -f colors.xml ] && mv colors.xml app/src/main/res/values/ || true
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/ || true
          [ -f themes.xml ] && mv themes.xml app/src/main/res/values/ || true
          [ -f network_security_config.xml ] && mv network_security_config.xml app/src/main/res/xml/ || true

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "ZaeemTrading"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.zaeem.trading'
              compileSdk 34

              defaultConfig {
                  applicationId "com.zaeem.trading"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

      - name: Download and Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          sudo ln -s $(pwd)/gradle-8.2/bin/gradle /usr/bin/gradle

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zaeem-trading-app
          path: app/build/outputs/apk/debug/app-debug.apk
          
