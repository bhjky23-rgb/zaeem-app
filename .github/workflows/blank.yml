name: Build PocketOption Bridge APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Project Structure
        run: |
          mkdir -p app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/res/xml app/src/main/java/com/zaeem/trading
          [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app/src/main/ || true
          [ -f activity_main.xml ] && cp activity_main.xml app/src/main/res/layout/ || true
          [ -f activity_session_login.xml ] && cp activity_session_login.xml app/src/main/res/layout/ || true
          [ -f bg_button_gold.xml ] && cp bg_button_gold.xml app/src/main/res/drawable/ || true
          [ -f bg_input.xml ] && cp bg_input.xml app/src/main/res/drawable/ || true
          [ -f colors.xml ] && cp colors.xml app/src/main/res/values/ || true
          [ -f strings.xml ] && cp strings.xml app/src/main/res/values/ || true
          [ -f themes.xml ] && cp themes.xml app/src/main/res/values/ || true
          [ -f network_security_config.xml ] && cp network_security_config.xml app/src/main/res/xml/ || true

          cat << 'EOF' > settings.gradle
          rootProject.name = "ZaeemTrading"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.zaeem.trading'
              compileSdk 34

              defaultConfig {
                  applicationId "com.zaeem.trading"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

      - name: Build APK via Gradle
        run: |
          gradle wrapper --gradle-version 8.1.1
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Zaeem-Trading-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
